<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; base-uri 'self'"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1116" />
    <meta name="description" content="A personal operating system for becoming." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Atlas</title>
    <script>
      // Theme boot: resolve before first paint so no flash ever occurs.
      ;(function () {
        try {
          var stored = localStorage.getItem('atlas.theme')
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
